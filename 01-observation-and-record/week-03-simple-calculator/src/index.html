<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Calculator</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f4; }
    .calculator { border: 1px solid #ccc; padding: 20px; border-radius: 5px; background-color: #fff; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    .calculator input, .calculator button { margin: 5px; padding: 10px; font-size: 16px; }
    .calculator input { width: 100%; box-sizing: border-box; }
    .calculator button { width: 22%; }
    .calculator button.operator { background-color: #f39c12; color: #fff; }
  </style>
</head>
<body>
  <div class="calculator">
    <input type="text" id="display" disabled>
    <br>
    <button onclick="appendNumber('7')">7</button>
    <button onclick="appendNumber('8')">8</button>
    <button onclick="appendNumber('9')">9</button>
    <br>
    <button onclick="appendNumber('4')">4</button>
    <button onclick="appendNumber('5')">5</button>
    <button onclick="appendNumber('6')">6</button>
    <br>
    <button onclick="appendNumber('1')">1</button>
    <button onclick="appendNumber('2')">2</button>
    <button onclick="appendNumber('3')">3</button>
    <br>
    <button onclick="appendNumber('0')">0</button>
    <button onclick="appendNumber('.')">.</button>
    <button onclick="clearDisplay()">C</button>
    <button class="operator" onclick="setOperation('+')">+</button>
    <button class="operator" onclick="setOperation('-')">-</button>
    <button class="operator" onclick="setOperation('*')">*</button>
    <button class="operator" onclick="setOperation('/')">/</button>
    <br>
    <button style="width: 100%;" onclick="calculate()">=</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
